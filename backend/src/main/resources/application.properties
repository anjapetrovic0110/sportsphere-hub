spring.application.name=sportsphere-backend
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/sportsphere?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Belgrade}
spring.datasource.username=${DB_USERNAME:sportsphere}
spring.datasource.password=${DB_PASSWORD}
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.upload.directory=${UPLOAD_DIRECTORY:../uploads}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
app.mail.from=${MAIL_FROM:noreply@sportsphere.local}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
