<section>
  <div>
    <h1>Administratorska prijava</h1>
    <p>Unesite administratorsko korisničko ime i lozinku.</p>
  </div>
  <form #forma="ngForm" (ngSubmit)="prijava()">
    <label>
      Korisničko ime
      <input name="korisnickoIme" [(ngModel)]="podaci.korisnickoIme" required />
    </label>
    <label>
      Lozinka
      <input
        type="password"
        name="lozinka"
        autocomplete="current-password"
        [(ngModel)]="podaci.lozinka"
        required
      />
    </label>
    <button [disabled]="forma.invalid || slanje">
      {{ slanje ? 'Prijavljivanje...' : 'Prijavi se' }}
    </button>
    @if (poruka) {
      <p class="greska">{{ poruka }}</p>
    }
  </form>
</section>
